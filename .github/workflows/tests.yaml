---
name: "Tests"

on:
  - pull_request

jobs:
  build-macos:
    name: "MacOS (${{ matrix.preset }})"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [sanitize, release]
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
      - name: "Install dependencies"
        run: |
          brew install libgit2 googletest ninja
      - name: "CMake configure"
        run: cmake --preset ${{ matrix.preset }}
      - name: "CMake build"
        run: cmake --build --preset ${{ matrix.preset }}
      - name: "Test"
        run: ctest --preset ${{ matrix.preset }}
      - name: "Upload results"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-aarch64-${{ matrix.preset }}-test-results
          path: build/${{ matrix.preset }}/Testing

  build-ubuntu:
    name: "Ubuntu (${{ matrix.preset }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [sanitize, release]
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
      - name: "Install dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y googletest ninja-build
      - name: "CMake configure"
        run: cmake --preset ${{ matrix.preset }}
      - name: "CMake build"
        run: cmake --build --preset ${{ matrix.preset }}
      - name: "Test"
        run: ctest --preset ${{ matrix.preset }}
      - name: "Upload results"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-${{ matrix.preset }}-test-results
          path: build/${{ matrix.preset }}/Testing

  integration:
    name: "Integration (Ubuntu)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
      - name: "Install dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: "CMake configure"
        run: cmake --preset integration
      - name: "CMake build"
        run: cmake --build --preset integration
      - name: "Test"
        run: ctest --preset integration
