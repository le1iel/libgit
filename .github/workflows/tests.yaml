---
name: "Tests"

on:
  - pull_request

jobs:
  build:
    name: "${{ matrix.os }} (${{ matrix.preset }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        preset: [sanitize, release]
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
      - name: "Install dependencies (macOS)"
        if: runner.os == 'macOS'
        run: brew install libgit2 googletest ninja
      - name: "Install dependencies (Linux)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y googletest ninja-build
      - name: "CMake configure"
        run: cmake --preset ${{ matrix.preset }}
      - name: "CMake build"
        run: cmake --build --preset ${{ matrix.preset }}
      - name: "Test"
        run: ctest --preset ${{ matrix.preset }}
      - name: "Upload results"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-${{ matrix.preset }}-test-results
          path: build/${{ matrix.preset }}/Testing

  integration:
    name: "Integration (Ubuntu)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
      - name: "Install dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: "CMake configure"
        run: cmake --preset integration
      - name: "CMake build"
        run: cmake --build --preset integration
      - name: "Test"
        run: ctest --preset integration
