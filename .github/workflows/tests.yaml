---
name: "Tests"

on:
  - push
  - pull_request

env:
  BUILD_DIR: build
  LIBGIT_CMAKE: "/opt/homebrew/Cellar/libgit2/1.9.0/lib/cmake/libgit2/libgit2Targets.cmake"

jobs:
  build-macos:
    name: "MacOS Build"
    runs-on: macos-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: "Install dependencies"
        run: |
          brew install libgit2 googletest
      - name: "Make libgit2 work"
        run: |
          sed -i '' 's/.\/include\/git2/include/' ${{env.LIBGIT_CMAKE}}
      - name: "CMake configure"
        run: |
          cmake -S . -B ${{env.BUILD_DIR}}
      - name: "CMake build"
        run: |
          cmake --build ${{env.BUILD_DIR}}
      - name: "Tar files"
        run: tar -cvf build-macos-aarch64.tar "${{env.BUILD_DIR}}"
      - name: "Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: build-macos-aarch64
          path: build-macos-aarch64.tar
  test-macos:
    name: "MacOS Test"
    needs: build-macos
    runs-on: macos-latest
    steps:
      - name: "Download build artifact"
        uses: actions/download-artifact@v4
        with:
          name: build-macos-aarch64
          path: build-macos-aarch64.tar
      - name: "Untar files"
        run: |
          realpath build-macos-aarch64.tar;
          echo "";
          tar -xzvf build-macos-aarch64.tar -C ${{env.BUILD_DIR}}
      - name: "Test"
        run: |
          cd ${{env.BUILD_DIR}} && ctest
