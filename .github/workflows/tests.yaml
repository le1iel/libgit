---
name: "Tests"

on:
  - push
  - pull_request

env:
  BUILD_DIR: build

jobs:
  build-macos:
    name: "MacOS Build"
    runs-on: macos-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: "Install dependencies"
        run: |
          brew install libgit2 googletest
      - name: "CMake configure"
        run: |
          cmake -S . -B ${{env.BUILD_DIR}}
      - name: "CMake build"
        run: |
          cmake --build ${{env.BUILD_DIR}}
      - name: "Tar files"
        run: tar -czf build-macos-aarch64.tar.gz "${{env.BUILD_DIR}}"
      - name: "Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: build-macos-aarch64
          path: build-macos-aarch64.tar.gz
      - name: "Test"
        run: |
          cd ${{env.BUILD_DIR}} && ctest
      - name: "Upload results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64-test-results
          path: "${{env.BUILD_DIR}}/Testing"
  build-ubuntu:
    name: "Ubuntu Build"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: "Install dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y googletest
      - name: "CMake configure"
        run: |
          cmake -S . -B ${{env.BUILD_DIR}}
      - name: "CMake build"
        run: |
          cmake --build ${{env.BUILD_DIR}}
      - name: "Tar files"
        run: tar -czf build-ubuntu.tar.gz "${{env.BUILD_DIR}}"
      - name: "Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: build-ubuntu
          path: build-ubuntu.tar.gz
      - name: "Test"
        run: |
          cd ${{env.BUILD_DIR}} && ctest
      - name: "Upload results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-test-results
          path: "${{env.BUILD_DIR}}/Testing"
