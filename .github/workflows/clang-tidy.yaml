name: Clang-Tidy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - ".clang-tidy"
      - ".github/workflows/clang-tidy.yaml"
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - ".clang-tidy"
      - ".github/workflows/clang-tidy.yaml"

jobs:
  clang-tidy:
    name: Run clang-tidy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy cmake ninja-build libssl-dev libcurl4-openssl-dev

      - name: Configure CMake
        run: |
          cmake -B build -S . -G Ninja -DGITXX_BUILD_TESTING=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          find src include tests -type f \( -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" -o -name "*.c" -o -name "*.h" -o -name "*.hpp" \) -print0 | \
          xargs -0 -P$(nproc) clang-tidy -p build --config-file=.clang-tidy || true

      - name: Check for clang-tidy warnings/errors
        run: |
          WARNINGS=$(find src include tests -type f \( -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" -o -name "*.c" -o -name "*.h" -o -name "*.hpp" \) -print0 | \
                   xargs -0 -P$(nproc) clang-tidy -p build --config-file=.clang-tidy 2>&1 | tee clang-tidy-output.txt | grep -E "warning:|error:" | wc -l)

          if [ "$WARNINGS" -gt 0 ]; then
            echo "::warning::clang-tidy found $WARNINGS warnings/errors"
            echo "::group::clang-tidy output"
            cat clang-tidy-output.txt
            echo "::endgroup::"
            exit 1
          else
            echo "No clang-tidy warnings/errors found"
          fi
